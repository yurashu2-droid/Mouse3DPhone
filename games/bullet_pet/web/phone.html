<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>弾を飼う — Pocket</title><link rel="stylesheet" href="/assets/style.css"></head><body class="phone"><main class="pocket"><header><a class="brand" href="#">BULLET<span>PET</span><small>YOUR LITTLE POCKET</small></a><span id="connection" class="badge">接続中…</span></header><div class="phone-stats"><span>ライフ <b id="lives">5</b></span><strong id="phase">WAITING</strong><span><b id="time">120</b>s</span></div><div class="pot-wrap"><canvas id="pot" aria-label="弾の容器。指でドラッグして傾けられます"></canvas><span class="pot-tag">POCKET / <b id="count">0</b> PETS</span></div><div class="phone-phase"><b id="phaseLeft"></b><p id="hint">参加して、PCから弾を受けとめよう</p></div><div class="phone-actions"><button id="join">参加 / 再開</button><button id="fire">送りかえす ↗</button></div><div class="secondary-actions"><button id="recenter" class="quiet">傾きをリセット</button><button id="stop" class="quiet">停止</button></div><p id="notice" role="status">参加ボタンを押すまで操作は送信されません。</p><p class="muted" id="inputHint">容器を指でドラッグして傾けられます。</p><div class="tilt-meter"><i id="tiltDot"></i></div></main><script type="module" src="/assets/phone.js"></script></body></html>
